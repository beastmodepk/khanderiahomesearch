<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donnell Khanderia Home Search</title>
<link rel="stylesheet" href="assets/spices.css">
</head>
<body>

<header class="topbar glass">
  <a class="brand" href="index.html"><span class="n-donnell">Donnell</span> <span class="n-khanderia">Khanderia</span> <span class="n-home">Home Search</span></a>
  <nav><a class="navbtn" href="index.html">Home</a><a class="navbtn" href="about.html">About</a></nav>
</header>

<div class="gate-wrap">
  <div class="split">

    <!-- BUY door — tap it for the Buy homepage -->
    <section class="door buy glass">
      <div class="dlabel">BUY</div>
      <div class="tiles">
        <a class="tile" href="buy/3-balsam-dr.html">
          <span class="ph"><img src="images/balsam.jpg" alt="3 Balsam Dr, Chelmsford — a white ranch house"></span>
          <span class="cap">
            <p class="t">3 Balsam Dr <span class="stamp rejected">Rejected</span></p>
            <p class="s">Chelmsford · REJECTED — VALUE MATHS</p>
          </span>
        </a>
      </div>
    </section>

    <!-- LEASE door — tap it for the Lease homepage -->
    <section class="door lease glass">
      <div class="dlabel">LEASE</div>
      <div class="tiles">
        <a class="tile" href="rent/towers-at-longfellow.html">
          <span class="ph"><img src="images/longfellow.jpg" alt="Towers at Longfellow, Boston — twin residential towers"></span>
          <span class="cap">
            <p class="t">Towers at Longfellow</p>
            <p class="s">5 units · Boston</p>
          </span>
        </a>
        <a class="tile" href="rent/index.html#unit-315-on-a">
          <span class="ph"><img src="images/315-on-a.jpg" alt="315 on A, Boston — brick high-rise at dusk"></span>
          <span class="cap">
            <p class="t">315 on A</p>
            <p class="s">Boston · IN REVIEW</p>
          </span>
        </a>
        <a class="tile" href="rent/index.html#unit-halstead">
          <span class="ph"><img src="images/halstead.jpg" alt="Halstead Burlington — red-brick residential tower"></span>
          <span class="cap">
            <p class="t">Halstead Burlington</p>
            <p class="s">1 unit · Burlington</p>
          </span>
        </a>
      </div>
    </section>

  </div>
</div>

<script>
/* The doors themselves are the buttons: a tap anywhere on a door
   (that isn't a photo tile) opens that side's homepage. */
document.querySelector(".door.buy").addEventListener("click", function (e) {
  if (!e.target.closest(".tile")) location.href = "buy/index.html";
});
document.querySelector(".door.lease").addEventListener("click", function (e) {
  if (!e.target.closest(".tile")) location.href = "rent/index.html";
});
</script>
<script src="assets/spices.js"></script>
</body>
</html>
